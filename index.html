<!doctype html>
<html lang="pt-br">
  <head>
    <title>Renomeador de Arquivos</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Renomeador de arquivos por bloco, com conversão automática para PDF e download em lote."
    />
  </head>
  <body>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap");

      #ns-app {
        --bg: #eef1f5;
        --surface: #ffffff;
        --surface-2: #f5f7fa;
        --border: #e4e8ee;
        --text: #1e2532;
        --text-dim: #8994a3;
        --accent: #16a558;
        --accent-dark: #0f8a47;
        --accent-soft: #e3f7ec;
        --error: #e23d63;
        --error-soft: #fdeaef;
        --warn: #d97a1f;
        --warn-soft: #fdf1e2;
        --stamp: #c0392b;
        --radius: 16px;
        --radius-sm: 10px;
        --shadow-card:
          0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 16px rgba(16, 24, 40, 0.05);
        font-family: "Inter", system-ui, sans-serif;
        background: linear-gradient(180deg, #f4f6f9, #eef1f5);
        color: var(--text);
        min-height: 100%;
        padding: 28px 20px 60px;
        box-sizing: border-box;
      }
      #ns-app * {
        box-sizing: border-box;
      }
      #ns-app .mono {
        font-family: "IBM Plex Mono", monospace;
      }

      .ns-shell {
        max-width: 1040px;
        margin: 0 auto;
      }

      .ns-header {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        padding: 22px 26px;
        margin-bottom: 20px;
      }
      .ns-eyebrow {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent-dark);
        margin: 0 0 6px;
      }
      .ns-eyebrow::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        display: inline-block;
      }
      .ns-title {
        font-size: 21px;
        font-weight: 800;
        letter-spacing: -0.01em;
        margin: 0 0 18px;
        color: var(--text);
      }
      .ns-field label {
        display: block;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-dim);
        margin-bottom: 6px;
      }
      .ns-field input {
        width: 100%;
        max-width: 320px;
        background: var(--surface-2);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 11px 12px;
        color: var(--text);
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .ns-field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(22, 165, 88, 0.14);
      }
      .ns-field input.ns-invalid {
        border-color: var(--error);
        box-shadow: 0 0 0 3px rgba(226, 61, 99, 0.12);
      }

      .ns-toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .ns-tool-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface);
        border: 1.5px solid var(--border);
        color: var(--text-dim);
        font-size: 12.5px;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 999px;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s,
          border-color 0.15s;
      }
      .ns-tool-btn:hover {
        border-color: var(--accent);
        color: var(--accent-dark);
        background: var(--accent-soft);
      }
      .ns-tool-btn-ghost:hover {
        border-color: var(--error);
        color: var(--error);
        background: var(--error-soft);
      }

      .ns-grid {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }

      .ns-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        overflow: hidden;
        position: relative;
      }
      .ns-card-body {
        display: flex;
        flex-direction: column;
      }
      .ns-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px 8px;
      }
      .ns-card-head-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .ns-content-row {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px;
        padding: 4px 16px 16px;
      }
      .ns-card-head input {
        flex: 1;
        background: transparent;
        border: none;
        border-bottom: 1.5px dashed transparent;
        color: var(--text);
        font-weight: 700;
        font-size: 14.5px;
        padding: 2px 2px 4px;
        outline: none;
      }
      .ns-card-head input:focus {
        border-bottom-color: var(--accent);
      }
      .ns-card-head button.ns-del {
        background: transparent;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        padding: 6px;
        border-radius: 8px;
        line-height: 0;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .ns-card-head button.ns-del:hover {
        color: var(--error);
        background: var(--error-soft);
      }

      .ns-merge-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-dim);
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
        white-space: nowrap;
      }
      .ns-merge-row input {
        display: none;
      }
      .ns-merge-slider {
        width: 30px;
        height: 17px;
        flex-shrink: 0;
        background: var(--surface-2);
        border: 1.5px solid var(--border);
        border-radius: 999px;
        position: relative;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .ns-merge-slider::after {
        content: "";
        position: absolute;
        top: 1px;
        left: 1px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.25);
        transition: transform 0.15s;
      }
      .ns-merge-row input:checked + .ns-merge-slider {
        background: var(--accent);
        border-color: var(--accent);
      }
      .ns-merge-row input:checked + .ns-merge-slider::after {
        transform: translateX(13px);
      }

      .ns-drop {
        width: 172px;
        flex-shrink: 0;
        border: 1.5px dashed var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 10px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s,
          background 0.15s;
        position: relative;
      }
      .ns-drop-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        margin: 0 auto 8px;
        border-radius: 9px;
        background: var(--surface-2);
        color: var(--text-dim);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .ns-drop-title {
        font-size: 12px;
        font-weight: 700;
        color: var(--text);
      }
      .ns-drop-sub {
        font-size: 10.5px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      .ns-drop.ns-dragover {
        border-color: var(--accent);
        border-style: solid;
        background: var(--accent-soft);
      }
      .ns-drop.ns-dragover .ns-drop-icon {
        background: #ffffff;
        color: var(--accent);
      }
      .ns-drop.ns-dragover .ns-drop-title {
        color: var(--accent-dark);
      }
      .ns-drop input[type="file"] {
        display: none;
      }

      .ns-files {
        flex: 1 1 220px;
        min-width: 200px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 6px;
      }
      .ns-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 6px 8px;
        font-size: 12px;
        max-width: 220px;
      }
      .ns-chip.ns-bad {
        border-color: var(--error);
        background: var(--error-soft);
      }
      .ns-chip-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 500;
      }
      .ns-chip-tag {
        font-family: "IBM Plex Mono", monospace;
        font-size: 9px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent-dark);
        text-transform: uppercase;
      }
      .ns-chip.ns-bad .ns-chip-tag {
        background: #ffffff;
        color: var(--error);
      }
      .ns-chip button {
        background: transparent;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        line-height: 0;
        padding: 2px;
        border-radius: 6px;
      }
      .ns-chip button:hover {
        color: var(--error);
      }

      .ns-stamp {
        position: absolute;
        z-index: 6;
        pointer-events: none;
        filter: drop-shadow(0 1px 1px rgba(16, 24, 40, 0.12));
      }

      .ns-add-card {
        border: 1.5px dashed var(--border);
        border-radius: var(--radius);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        color: var(--text-dim);
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        gap: 8px;
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
        background: transparent;
        margin-bottom: 20px;
      }
      .ns-add-card:hover {
        border-color: var(--accent);
        color: var(--accent-dark);
        background: var(--accent-soft);
      }

      .ns-footer {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .ns-footer-msg {
        font-size: 13px;
        color: var(--text-dim);
        min-height: 18px;
        text-align: center;
        font-weight: 500;
      }
      .ns-footer-msg.ns-err {
        color: var(--error);
      }
      .ns-footer-msg.ns-ok {
        color: var(--accent-dark);
      }

      .ns-save-btn {
        width: 100%;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: var(--radius-sm);
        padding: 17px 22px;
        font-weight: 700;
        font-size: 15.5px;
        letter-spacing: 0.01em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition:
          background 0.15s,
          transform 0.1s,
          box-shadow 0.15s;
        box-shadow: 0 2px 8px rgba(22, 165, 88, 0.28);
      }
      .ns-save-btn:hover {
        background: var(--accent-dark);
        box-shadow: 0 4px 16px rgba(22, 165, 88, 0.32);
      }
      .ns-save-btn:active {
        transform: translateY(1px);
      }
      .ns-save-btn[disabled] {
        opacity: 0.6;
        cursor: progress;
      }

      .ns-spin {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: ns-spin 0.7s linear infinite;
        display: none;
      }
      .ns-save-btn.ns-loading .ns-spin {
        display: inline-block;
      }
      .ns-save-btn.ns-loading .ns-save-label {
        opacity: 0.85;
      }
      @keyframes ns-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .ns-signature {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        color: var(--text-dim);
        font-size: 12px;
        font-style: italic;
        margin-top: 22px;
      }
      .ns-sign-mark {
        color: var(--accent);
        font-weight: 800;
        font-size: 16px;
        font-style: normal;
        line-height: 1;
      }

      @media (max-width: 700px) {
        .ns-content-row {
          flex-direction: column;
        }
        .ns-drop {
          width: auto;
        }
      }

      @media (max-width: 520px) {
        .ns-save-btn {
          padding: 15px;
          font-size: 14.5px;
        }
      }
    </style>

    <div id="ns-app">
      <div class="ns-shell">
        <div class="ns-header">
          <div class="ns-eyebrow">Organizador de anexos</div>
          <div class="ns-title">Renomeador de arquivos por bloco</div>
          <div class="ns-field">
            <label for="nsInput">Número da Nota de Serviço</label>
            <input
              id="nsInput"
              class="mono"
              type="text"
              inputmode="numeric"
              placeholder="Ex: 123456789"
              maxlength="10"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="ns-toolbar">
          <button class="ns-tool-btn" id="nsSaveDefaultBtn"></button>
          <button
            class="ns-tool-btn ns-tool-btn-ghost"
            id="nsResetDefaultBtn"
          ></button>
        </div>

        <div class="ns-grid" id="nsGrid"></div>

        <div class="ns-add-card" id="nsAddCard">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          >
            <line x1="12" y1="5" x2="12" y2="19" />
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
          Adicionar bloco
        </div>

        <div class="ns-footer">
          <button class="ns-save-btn" id="nsSaveBtn">
            <span class="ns-spin"></span>
            <span class="ns-save-label">Salvar e baixar tudo (.zip)</span>
          </button>
          <div class="ns-footer-msg" id="nsMsg"></div>
        </div>

        <div class="ns-signature mono">
          <span class="ns-sign-mark">*</span>feito por Tiaguinho do SGO<span class="ns-sign-mark">*</span>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
      (function () {
        var grid = document.getElementById("nsGrid");
        var addCard = document.getElementById("nsAddCard");
        var nsInput = document.getElementById("nsInput");
        var saveBtn = document.getElementById("nsSaveBtn");
        var msgEl = document.getElementById("nsMsg");
        var saveDefaultBtn = document.getElementById("nsSaveDefaultBtn");
        var resetDefaultBtn = document.getElementById("nsResetDefaultBtn");
        saveDefaultBtn.innerHTML = iconSave() + "Salvar como padrão";
        resetDefaultBtn.innerHTML = iconReset() + "Restaurar padrão de fábrica";

        var blocks = [];
        var blockSeq = 0;
        var fileSeq = 0;

        var IMG_EXT = ["png", "jpg", "jpeg", "webp", "gif", "bmp"];

        function extOf(name) {
          var parts = (name || "").split(".");
          return parts.length > 1 ? parts.pop().toLowerCase() : "";
        }

        function sanitize(s) {
          var out = (s || "")
            .trim()
            .replace(/[\\\/:*?"<>|]+/g, "-")
            .replace(/\s+/g, " ")
            .trim();
          return out || "sem-nome";
        }

        function setMsg(text, kind) {
          msgEl.textContent = text || "";
          msgEl.className = "ns-footer-msg" + (kind ? " ns-" + kind : "");
        }

        function fmtSize(bytes) {
          if (bytes < 1024) return bytes + " B";
          if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + " KB";
          return (bytes / (1024 * 1024)).toFixed(1) + " MB";
        }

        function iconUpload() {
          return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>';
        }
        function iconX() {
          return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        }
        function iconTrash() {
          return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
        }
        function iconSave() {
          return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';
        }
        function iconReset() {
          return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';
        }

        var stampSeq = 0;

        function buildStampSVG() {
          stampSeq++;
          var topPathId = "stampTop" + stampSeq;
          var bottomPathId = "stampBottom" + stampSeq;
          var filterId = "stampRough" + stampSeq;
          var seed = Math.floor(Math.random() * 100);
          return (
            '<svg viewBox="0 0 130 130" width="106" height="106">' +
            "<defs>" +
            '<path id="' +
            topPathId +
            '" d="M 28,65 A 37,37 0 0 1 102,65" />' +
            '<path id="' +
            bottomPathId +
            '" d="M 102,65 A 37,37 0 0 1 28,65" />' +
            '<filter id="' +
            filterId +
            '" x="-25%" y="-25%" width="150%" height="150%">' +
            '<feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="' +
            seed +
            '" result="noise" />' +
            '<feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" />' +
            "</filter>" +
            "</defs>" +
            '<g filter="url(#' +
            filterId +
            ')">' +
            '<g fill="none" stroke="var(--stamp)" stroke-width="2.2" opacity="0.9">' +
            '<circle cx="65" cy="65" r="48" />' +
            '<circle cx="65" cy="65" r="27" stroke-width="1.2" />' +
            "</g>" +
            '<circle cx="28" cy="65" r="1.6" fill="var(--stamp)" opacity="0.9" />' +
            '<circle cx="102" cy="65" r="1.6" fill="var(--stamp)" opacity="0.9" />' +
            '<text text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="var(--stamp)" opacity="0.9">' +
            '<textPath href="#' +
            topPathId +
            '" startOffset="50%">TIAGUINHO</textPath>' +
            "</text>" +
            '<text text-anchor="middle" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.9" fill="var(--stamp)" opacity="0.9">' +
            '<textPath href="#' +
            bottomPathId +
            '" startOffset="50%">SGO É O COMANDO</textPath>' +
            "</text>" +
            '<text x="65" y="71" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="var(--stamp)" opacity="0.9">OK</text>' +
            "</g>" +
            "</svg>"
          );
        }

        var STAMP_ROTATIONS = [
          -32, -24, -16, -8, 8, 16, 24, 32, 172, -172, 4, -4,
        ];
        var STAMP_PLACEMENTS = [
          { top: "6px", right: "10px" },
          { bottom: "6px", right: "10px" },
          { top: "6px", right: "150px" },
          { bottom: "6px", right: "150px" },
          { top: "50%", right: "40px", centerY: true },
          { top: "50%", right: "190px", centerY: true },
        ];

        function addStamp(block) {
          if (block.stampEl) return;
          var rot =
            STAMP_ROTATIONS[Math.floor(Math.random() * STAMP_ROTATIONS.length)];
          var pos =
            STAMP_PLACEMENTS[
              Math.floor(Math.random() * STAMP_PLACEMENTS.length)
            ];
          var wrap = document.createElement("div");
          wrap.className = "ns-stamp";
          Object.keys(pos).forEach(function (k) {
            if (k !== "centerY") wrap.style[k] = pos[k];
          });
          wrap.style.transform =
            (pos.centerY ? "translateY(-50%) " : "") + "rotate(" + rot + "deg)";
          wrap.innerHTML = buildStampSVG();
          block.el.appendChild(wrap);
          block.stampEl = wrap;
        }

        function removeStamp(block) {
          if (block.stampEl) {
            block.stampEl.remove();
            block.stampEl = null;
          }
        }

        function createBlock(name) {
          blockSeq++;
          var block = {
            id: "b" + blockSeq,
            files: [],
            el: null,
            nameInput: null,
            filesEl: null,
            dropEl: null,
            stampEl: null,
          };

          var card = document.createElement("div");
          card.className = "ns-card";
          card.innerHTML =
            '<div class="ns-card-body">' +
            '<div class="ns-card-head">' +
            '<input type="text" class="ns-block-name" value="' +
            name.replace(/"/g, "&quot;") +
            '" />' +
            '<div class="ns-card-head-right">' +
            '<label class="ns-merge-row">' +
            '<input type="checkbox" class="ns-merge-check" checked />' +
            '<span class="ns-merge-slider"></span>' +
            "<span>Mesclar</span>" +
            "</label>" +
            '<button class="ns-del" title="Remover bloco">' +
            iconTrash() +
            "</button>" +
            "</div>" +
            "</div>" +
            '<div class="ns-content-row">' +
            '<div class="ns-drop">' +
            '<span class="ns-drop-icon">' +
            iconUpload() +
            "</span>" +
            '<div class="ns-drop-title">Arraste arquivos aqui</div>' +
            '<div class="ns-drop-sub">ou clique para selecionar</div>' +
            '<input type="file" multiple />' +
            "</div>" +
            '<div class="ns-files"></div>' +
            "</div>" +
            "</div>";

          grid.appendChild(card);

          block.el = card;
          block.nameInput = card.querySelector(".ns-block-name");
          block.dropEl = card.querySelector(".ns-drop");
          block.filesEl = card.querySelector(".ns-files");
          block.merge = true;
          var mergeCheck = card.querySelector(".ns-merge-check");
          mergeCheck.addEventListener("change", function () {
            block.merge = mergeCheck.checked;
          });
          var fileInput = card.querySelector("input[type=file]");

          card.querySelector(".ns-del").addEventListener("click", function () {
            if (
              block.files.length &&
              !confirm("Remover este bloco e os arquivos nele?")
            )
              return;
            blocks = blocks.filter(function (b) {
              return b.id !== block.id;
            });
            card.remove();
          });

          block.dropEl.addEventListener("click", function () {
            fileInput.click();
          });
          fileInput.addEventListener("change", function () {
            addFiles(block, Array.prototype.slice.call(fileInput.files));
            fileInput.value = "";
          });

          ["dragenter", "dragover"].forEach(function (evt) {
            block.dropEl.addEventListener(evt, function (e) {
              e.preventDefault();
              e.stopPropagation();
              block.dropEl.classList.add("ns-dragover");
            });
          });
          ["dragleave", "dragend"].forEach(function (evt) {
            block.dropEl.addEventListener(evt, function (e) {
              block.dropEl.classList.remove("ns-dragover");
            });
          });
          block.dropEl.addEventListener("drop", function (e) {
            e.preventDefault();
            e.stopPropagation();
            block.dropEl.classList.remove("ns-dragover");
            addFiles(block, Array.prototype.slice.call(e.dataTransfer.files));
          });

          blocks.push(block);
          return block;
        }

        function addFiles(block, fileList) {
          fileList.forEach(function (file) {
            fileSeq++;
            var ext = extOf(file.name);
            var supported =
              ext === "pdf" ||
              file.type === "application/pdf" ||
              file.type.indexOf("image/") === 0 ||
              IMG_EXT.indexOf(ext) !== -1;
            block.files.push({
              id: "f" + fileSeq,
              file: file,
              supported: supported,
            });
          });
          renderFiles(block);
          addStamp(block);
          setMsg("", "");
        }

        function renderFiles(block) {
          block.filesEl.innerHTML = "";
          block.files.forEach(function (entry) {
            var chip = document.createElement("div");
            chip.className = "ns-chip" + (entry.supported ? "" : " ns-bad");
            var tag = entry.supported
              ? extOf(entry.file.name) === "pdf"
                ? "pdf"
                : "img"
              : "?";
            chip.innerHTML =
              '<span class="ns-chip-tag">' +
              tag +
              "</span>" +
              '<span class="ns-chip-name" title="' +
              entry.file.name +
              '">' +
              entry.file.name +
              "</span>" +
              '<span class="mono" style="color:var(--text-dim);font-size:10px;">' +
              fmtSize(entry.file.size) +
              "</span>" +
              '<button title="Remover">' +
              iconX() +
              "</button>";
            if (!entry.supported)
              chip.title =
                "Formato não suportado para conversão automática — será ignorado ao salvar";
            chip.querySelector("button").addEventListener("click", function () {
              block.files = block.files.filter(function (f) {
                return f.id !== entry.id;
              });
              renderFiles(block);
              if (block.files.length === 0) removeStamp(block);
            });
            block.filesEl.appendChild(chip);
          });
        }

        addCard.addEventListener("click", function () {
          var b = createBlock("Novo bloco");
          b.nameInput.focus();
          b.nameInput.select();
        });

        var STORAGE_KEY = "ns_blocos_padrao_v1";
        var DEFAULT_BLOCKS = [
          "COMUNICADO DE COMISSIONAMENTO DE PROJETO - CCP",
          "DOCUMENTOS PARA ANÁLISE TÉCNICA DA INTERVENÇÃO AMBIENTAL",
          "EXTRATO DE MÃO DE OBRA PARA CONFERÊNCIA",
          "ORÇAMENTO DO PROORC - LISTA CODIFICADA",
          "ORÇAMENTO DO PROORC - MATERIAL REQUISITADO",
          "ORÇAMENTO DO PROORC - SERVIÇOS CONTRATADOS",
          "ORÇAMENTO DO PROORC - TOTALIZAÇÃO",
          "PROJETO - REDE DE DISTRIBUIÇÃO",
          "ANÁLISE DE DERIVAÇÃO - DERIVA",
          "INSTRUMENTO PARTICULAR DE CONSTITUIÇÃO DE SERVIDÃO",
          "MEMÓRIA DE CÁLCULO DE AFASTAMENTO DE REDE",
          "MEMÓRIA DE CÁLCULO DE ESFORÇO MECÂNICO",
          "MEMÓRIA DE CÁLCULO DE QUEDA DE TENSÃO",
          "OBSERVACOES DA CONTRATADA PARA A CEMIG",
          "ORÇAMENTO DO PROORC - MATERIAL SALVADO",
          "PROJETO - DETALHE",
          "PROJETO - OCUPAÇÃO DE FAIXA",
          "PROJETO - TRAVESSIA",
          "RELATÓRIO DE SIMULAÇÃO DE CARGA",
          "RELATÓRIO FOTOGRÁFICO DO LEVANTAMENTO DE CAMPO",
          "RELAÇÃO DE DADOS FÍSICOS - TÉCNICOS DA OBRA",
          "RESULTADO DE ANÁLISE DA COORDENAÇÃO E PROTEÇÃO",
        ];

        function loadSavedBlocks() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return null;
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) return parsed;
          } catch (e) {
            /* localStorage indisponível */
          }
          return null;
        }

        function buildBlocksFrom(list) {
          list.forEach(function (item) {
            var b = createBlock(typeof item === "string" ? item : item.name);
            var merge = typeof item === "string" ? true : item.merge !== false;
            if (!merge) {
              b.merge = false;
              var chk = b.el.querySelector(".ns-merge-check");
              if (chk) chk.checked = false;
            }
          });
        }

        var savedBlocks = loadSavedBlocks();
        buildBlocksFrom(savedBlocks || DEFAULT_BLOCKS);

        saveDefaultBtn.addEventListener("click", function () {
          var data = blocks.map(function (b) {
            return { name: b.nameInput.value, merge: b.merge };
          });
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            setMsg(
              "Padrão salvo — da próxima vez os blocos já abrem assim.",
              "ok",
            );
          } catch (e) {
            setMsg(
              "Não consegui salvar — o navegador bloqueou o armazenamento local.",
              "err",
            );
          }
        });

        resetDefaultBtn.addEventListener("click", function () {
          if (
            !confirm(
              "Restaurar os blocos para o padrão de fábrica? Isso substitui os blocos atuais na tela.",
            )
          )
            return;
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) {
            /* ignorar */
          }
          blocks.slice().forEach(function (b) {
            b.el.remove();
          });
          blocks = [];
          buildBlocksFrom(DEFAULT_BLOCKS);
          setMsg("Voltou pro padrão de fábrica.", "ok");
        });

        // ---- conversão / mesclagem em PDF ----

        function readAsDataURL(file) {
          return new Promise(function (resolve, reject) {
            var r = new FileReader();
            r.onload = function () {
              resolve(r.result);
            };
            r.onerror = reject;
            r.readAsDataURL(file);
          });
        }

        function loadImage(src) {
          return new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () {
              resolve(img);
            };
            img.onerror = reject;
            img.src = src;
          });
        }

        function dataURLToBytes(dataUrl) {
          var base64 = dataUrl.split(",")[1];
          var binary = atob(base64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++)
            bytes[i] = binary.charCodeAt(i);
          return bytes;
        }

        async function imageFileToPdfBytes(file) {
          var dataUrl = await readAsDataURL(file);
          var img = await loadImage(dataUrl);
          var canvas = document.createElement("canvas");
          canvas.width = img.naturalWidth || img.width;
          canvas.height = img.naturalHeight || img.height;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0);
          var pngBytes = dataURLToBytes(canvas.toDataURL("image/png"));
          var pdfDoc = await PDFLib.PDFDocument.create();
          var pngImage = await pdfDoc.embedPng(pngBytes);
          var page = pdfDoc.addPage([pngImage.width, pngImage.height]);
          page.drawImage(pngImage, {
            x: 0,
            y: 0,
            width: pngImage.width,
            height: pngImage.height,
          });
          return await pdfDoc.save();
        }

        async function fileToPdfBytes(file) {
          var ext = extOf(file.name);
          if (ext === "pdf" || file.type === "application/pdf") {
            return new Uint8Array(await file.arrayBuffer());
          }
          if (
            file.type.indexOf("image/") === 0 ||
            IMG_EXT.indexOf(ext) !== -1
          ) {
            return await imageFileToPdfBytes(file);
          }
          throw new Error("unsupported");
        }

        async function mergeBlockToPdf(block) {
          var merged = await PDFLib.PDFDocument.create();
          var ok = 0;
          for (var i = 0; i < block.files.length; i++) {
            var entry = block.files[i];
            try {
              var bytes = await fileToPdfBytes(entry.file);
              var src = await PDFLib.PDFDocument.load(bytes);
              var pages = await merged.copyPages(src, src.getPageIndices());
              pages.forEach(function (p) {
                merged.addPage(p);
              });
              ok++;
            } catch (e) {
              // arquivo não suportado, ignorado
            }
          }
          if (ok === 0) return null;
          return await merged.save();
        }

        async function convertBlockSeparately(block) {
          var results = [];
          var idx = 0;
          for (var i = 0; i < block.files.length; i++) {
            var entry = block.files[i];
            try {
              var bytes = await fileToPdfBytes(entry.file);
              idx++;
              results.push({
                name: sanitize(block.nameInput.value) + " (" + idx + ").pdf",
                bytes: bytes,
              });
            } catch (e) {
              // arquivo não suportado, ignorado
            }
          }
          return results;
        }

        function triggerDownload(blob, filename) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function () {
            URL.revokeObjectURL(url);
          }, 4000);
        }

        saveBtn.addEventListener("click", async function () {
          var ns = nsInput.value.trim();
          if (!ns) {
            nsInput.classList.add("ns-invalid");
            nsInput.focus();
            setMsg(
              "Faltou o número da Nota de Serviço — ele não nasce em árvore.",
              "err",
            );
            return;
          }
          nsInput.classList.remove("ns-invalid");

          var withFiles = blocks.filter(function (b) {
            return b.files.length > 0;
          });
          if (withFiles.length === 0) {
            setMsg(
              "Arraste ao menos um arquivo pra algum bloco — eu ainda não leio pensamento.",
              "err",
            );
            return;
          }

          saveBtn.disabled = true;
          saveBtn.classList.add("ns-loading");
          setMsg(
            "Convertendo e mesclando os arquivos... sem embaralhar, prometido.",
            "",
          );

          try {
            var zip = new JSZip();
            var folderName = sanitize(ns);
            var folder = zip.folder(folderName);
            var skippedBlocks = [];

            for (var i = 0; i < withFiles.length; i++) {
              var block = withFiles[i];
              if (block.merge) {
                var pdfBytes = await mergeBlockToPdf(block);
                if (pdfBytes) {
                  folder.file(
                    sanitize(block.nameInput.value) + ".pdf",
                    pdfBytes,
                  );
                } else {
                  skippedBlocks.push(block.nameInput.value);
                }
              } else {
                var separateResults = await convertBlockSeparately(block);
                if (separateResults.length === 0) {
                  skippedBlocks.push(block.nameInput.value);
                } else {
                  separateResults.forEach(function (r) {
                    folder.file(r.name, r.bytes);
                  });
                }
              }
            }

            var content = await zip.generateAsync({ type: "blob" });
            triggerDownload(content, folderName + ".zip");

            if (skippedBlocks.length) {
              setMsg(
                "Baixado, mas ficou de fora (sem arquivo válido): " +
                  skippedBlocks.join(", ") +
                  ".",
                "err",
              );
            } else {
              setMsg(
                "Pronto! " +
                  folderName +
                  ".zip baixado — pode fechar a aba sem medo.",
                "ok",
              );
            }
          } catch (e) {
            setMsg("Erro ao gerar o pacote: " + e.message, "err");
          } finally {
            saveBtn.disabled = false;
            saveBtn.classList.remove("ns-loading");
          }
        });

        nsInput.addEventListener("input", function () {
          var digitsOnly = nsInput.value.replace(/\D/g, "").slice(0, 10);
          if (digitsOnly !== nsInput.value) nsInput.value = digitsOnly;
          nsInput.classList.remove("ns-invalid");
        });
      })();
    </script>
  </body>
</html>
