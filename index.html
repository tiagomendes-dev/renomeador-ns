<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  #ns-app {
    --bg: #12171b;
    --surface: #1a2126;
    --surface-2: #212a30;
    --border: #2b363d;
    --text: #e7edf1;
    --text-dim: #8b98a3;
    --accent: #f2a93b;
    --accent-soft: #4a3a1c;
    --accent2: #49b7e8;
    --success: #57b88c;
    --error: #e2604d;
    --stamp: #d3492f;
    --radius: 10px;
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    padding: 28px 20px 60px;
    box-sizing: border-box;
  }
  #ns-app * { box-sizing: border-box; }
  #ns-app .mono { font-family: 'IBM Plex Mono', monospace; }

  .ns-shell { max-width: 1040px; margin: 0 auto; }

  .ns-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .ns-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: repeating-linear-gradient(
      -45deg,
      var(--accent), var(--accent) 10px,
      #1a2126 10px, #1a2126 20px
    );
    opacity: .85;
  }
  .ns-eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 6px 0 4px;
  }
  .ns-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--text);
  }
  .ns-field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .ns-field input {
    width: 100%;
    max-width: 340px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .02em;
    outline: none;
    transition: border-color .15s;
  }
  .ns-field input:focus { border-color: var(--accent); }
  .ns-field input.ns-invalid { border-color: var(--error); }

  .ns-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .ns-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .ns-card::before {
    content: "";
    display: block;
    height: 4px;
    background: repeating-linear-gradient(
      -45deg,
      var(--accent), var(--accent) 8px,
      var(--surface) 8px, var(--surface) 16px
    );
  }
  .ns-card-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 12px 10px 8px;
  }
  .ns-card-head input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: var(--text);
    font-weight: 600;
    font-size: 14.5px;
    padding: 2px 2px 4px;
    outline: none;
  }
  .ns-card-head input:focus { border-bottom-color: var(--accent); }
  .ns-card-head button.ns-del {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    line-height: 0;
  }
  .ns-card-head button.ns-del:hover { color: var(--error); background: rgba(226,96,77,.12); }

  .ns-merge-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px 10px;
    font-size: 11.5px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .ns-merge-row input { display: none; }
  .ns-merge-slider {
    width: 30px;
    height: 16px;
    flex-shrink: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    position: relative;
    transition: background .15s, border-color .15s;
  }
  .ns-merge-slider::after {
    content: "";
    position: absolute;
    top: 1px; left: 1px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform .15s, background .15s;
  }
  .ns-merge-row input:checked + .ns-merge-slider { background: var(--accent-soft); border-color: var(--accent); }
  .ns-merge-row input:checked + .ns-merge-slider::after { transform: translateX(14px); background: var(--accent); }

  .ns-drop {
    margin: 0 10px 10px;
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 18px 10px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .ns-drop svg { display: block; margin: 0 auto 6px; opacity: .6; }
  .ns-drop.ns-dragover {
    border-color: var(--accent);
    border-style: solid;
    background: repeating-linear-gradient(
      -45deg,
      rgba(242,169,59,.10), rgba(242,169,59,.10) 10px,
      rgba(242,169,59,.03) 10px, rgba(242,169,59,.03) 20px
    );
    color: var(--accent);
  }
  .ns-drop input[type=file] { display: none; }

  .ns-files {
    padding: 0 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .ns-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
  }
  .ns-chip.ns-bad { border-color: var(--error); }
  .ns-chip-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ns-chip-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    text-transform: uppercase;
  }
  .ns-chip.ns-bad .ns-chip-tag { background: rgba(226,96,77,.18); color: var(--error); }
  .ns-chip button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 0;
    padding: 2px;
  }
  .ns-chip button:hover { color: var(--error); }

  .ns-stamp {
    position: absolute;
    z-index: 6;
    pointer-events: none;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.35));
  }

  .ns-add-card {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 120px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    gap: 8px;
    transition: border-color .15s, color .15s;
    background: transparent;
    margin-bottom: 20px;
  }
  .ns-add-card:hover { border-color: var(--accent); color: var(--accent); }

  .ns-footer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ns-footer-msg { font-size: 13px; color: var(--text-dim); min-height: 18px; text-align: center; }
  .ns-footer-msg.ns-err { color: var(--error); }
  .ns-footer-msg.ns-ok { color: var(--success); }

  .ns-save-btn {
    width: 100%;
    background: var(--accent);
    color: #1a1204;
    border: none;
    border-radius: 8px;
    padding: 18px 22px;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .01em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: filter .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 0 0 0 rgba(242,169,59,.0);
  }
  .ns-save-btn:hover { filter: brightness(1.08); box-shadow: 0 4px 18px rgba(242,169,59,.25); }
  .ns-save-btn:active { transform: translateY(1px); }
  .ns-save-btn[disabled] { opacity: .55; cursor: progress; }

  .ns-spin {
    width: 16px; height: 16px;
    border: 2px solid rgba(0,0,0,.3);
    border-top-color: #1a1204;
    border-radius: 50%;
    animation: ns-spin .7s linear infinite;
    display: none;
  }
  .ns-save-btn.ns-loading .ns-spin { display: inline-block; }
  .ns-save-btn.ns-loading .ns-save-label { opacity: .7; }
  @keyframes ns-spin { to { transform: rotate(360deg); } }

  .ns-signature {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: .04em;
    margin-top: 22px;
    opacity: .7;
  }

  @media (max-width: 520px) {
    .ns-save-btn { padding: 16px; font-size: 15px; }
  }
</style>

<div id="ns-app">
  <div class="ns-shell">
    <div class="ns-header">
      <div class="ns-eyebrow">Organizador de anexos</div>
      <div class="ns-title">Renomeador de arquivos por bloco</div>
      <div class="ns-field">
        <label for="nsInput">Número da Nota de Serviço</label>
        <input id="nsInput" class="mono" type="text" inputmode="numeric" placeholder="Ex: 123456789" maxlength="10" autocomplete="off" />
      </div>
    </div>

    <div class="ns-grid" id="nsGrid"></div>

    <div class="ns-add-card" id="nsAddCard">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Adicionar bloco
    </div>

    <div class="ns-footer">
      <button class="ns-save-btn" id="nsSaveBtn">
        <span class="ns-spin"></span>
        <span class="ns-save-label">Salvar e baixar tudo (.zip)</span>
      </button>
      <div class="ns-footer-msg" id="nsMsg"></div>
    </div>

    <div class="ns-signature mono">feito por Tiaguinho do SGO</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function () {
  var grid = document.getElementById('nsGrid');
  var addCard = document.getElementById('nsAddCard');
  var nsInput = document.getElementById('nsInput');
  var saveBtn = document.getElementById('nsSaveBtn');
  var msgEl = document.getElementById('nsMsg');

  var blocks = [];
  var blockSeq = 0;
  var fileSeq = 0;

  var IMG_EXT = ['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp'];

  function extOf(name) {
    var parts = (name || '').split('.');
    return parts.length > 1 ? parts.pop().toLowerCase() : '';
  }

  function sanitize(s) {
    var out = (s || '').trim().replace(/[\\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
    return out || 'sem-nome';
  }

  function setMsg(text, kind) {
    msgEl.textContent = text || '';
    msgEl.className = 'ns-footer-msg' + (kind ? ' ns-' + kind : '');
  }

  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function iconUpload() {
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M6 10l6-6 6 6"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>';
  }
  function iconX() {
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  }
  function iconTrash() {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
  }

  var stampSeq = 0;

  function buildStampSVG() {
    stampSeq++;
    var topPathId = 'stampTop' + stampSeq;
    var bottomPathId = 'stampBottom' + stampSeq;
    var filterId = 'stampRough' + stampSeq;
    var seed = Math.floor(Math.random() * 100);
    return '<svg viewBox="0 0 130 130" width="106" height="106">' +
      '<defs>' +
        '<path id="' + topPathId + '" d="M 28,65 A 37,37 0 0 1 102,65" />' +
        '<path id="' + bottomPathId + '" d="M 102,65 A 37,37 0 0 1 28,65" />' +
        '<filter id="' + filterId + '" x="-25%" y="-25%" width="150%" height="150%">' +
          '<feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="' + seed + '" result="noise" />' +
          '<feDisplacementMap in="SourceGraphic" in2="noise" scale="1.3" />' +
        '</filter>' +
      '</defs>' +
      '<g filter="url(#' + filterId + ')">' +
        '<g fill="none" stroke="var(--stamp)" stroke-width="2.2" opacity="0.9">' +
          '<circle cx="65" cy="65" r="48" />' +
          '<circle cx="65" cy="65" r="27" stroke-width="1.2" />' +
        '</g>' +
        '<circle cx="28" cy="65" r="1.6" fill="var(--stamp)" opacity="0.9" />' +
        '<circle cx="102" cy="65" r="1.6" fill="var(--stamp)" opacity="0.9" />' +
        '<text text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="var(--stamp)" opacity="0.9">' +
          '<textPath href="#' + topPathId + '" startOffset="50%">TIAGUINHO</textPath>' +
        '</text>' +
        '<text text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.9" fill="var(--stamp)" opacity="0.9">' +
          '<textPath href="#' + bottomPathId + '" startOffset="50%">SGO É O COMANDO</textPath>' +
        '</text>' +
        '<text x="65" y="71" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="24" font-weight="700" fill="var(--stamp)" opacity="0.9">OK</text>' +
      '</g>' +
    '</svg>';
  }

  var STAMP_ROTATIONS = [-32, -24, -16, -8, 8, 16, 24, 32, 172, -172, 4, -4];
  var STAMP_PLACEMENTS = [
    { top: '6px', left: '6px' },
    { top: '6px', right: '6px' },
    { bottom: '6px', left: '6px' },
    { bottom: '6px', right: '6px' },
    { top: '28%', left: '8px' },
    { top: '24%', right: '8px' }
  ];

  function addStamp(block) {
    if (block.stampEl) return;
    var rot = STAMP_ROTATIONS[Math.floor(Math.random() * STAMP_ROTATIONS.length)];
    var pos = STAMP_PLACEMENTS[Math.floor(Math.random() * STAMP_PLACEMENTS.length)];
    var wrap = document.createElement('div');
    wrap.className = 'ns-stamp';
    Object.keys(pos).forEach(function (k) { wrap.style[k] = pos[k]; });
    wrap.style.transform = 'rotate(' + rot + 'deg)';
    wrap.innerHTML = buildStampSVG();
    block.el.appendChild(wrap);
    block.stampEl = wrap;
  }

  function removeStamp(block) {
    if (block.stampEl) { block.stampEl.remove(); block.stampEl = null; }
  }

  function createBlock(name) {
    blockSeq++;
    var block = { id: 'b' + blockSeq, files: [], el: null, nameInput: null, filesEl: null, dropEl: null, stampEl: null };

    var card = document.createElement('div');
    card.className = 'ns-card';
    card.innerHTML =
      '<div class="ns-card-head">' +
        '<input type="text" class="ns-block-name" value="' + name.replace(/"/g, '&quot;') + '" />' +
        '<button class="ns-del" title="Remover bloco">' + iconTrash() + '</button>' +
      '</div>' +
      '<label class="ns-merge-row">' +
        '<input type="checkbox" class="ns-merge-check" checked />' +
        '<span class="ns-merge-slider"></span>' +
        '<span>Mesclar em 1 arquivo</span>' +
      '</label>' +
      '<div class="ns-drop">' +
        iconUpload() +
        'Arraste arquivos aqui<br>ou clique para selecionar' +
        '<input type="file" multiple />' +
      '</div>' +
      '<div class="ns-files"></div>';

    grid.appendChild(card);

    block.el = card;
    block.nameInput = card.querySelector('.ns-block-name');
    block.dropEl = card.querySelector('.ns-drop');
    block.filesEl = card.querySelector('.ns-files');
    block.merge = true;
    var mergeCheck = card.querySelector('.ns-merge-check');
    mergeCheck.addEventListener('change', function () { block.merge = mergeCheck.checked; });
    var fileInput = card.querySelector('input[type=file]');

    card.querySelector('.ns-del').addEventListener('click', function () {
      if (block.files.length && !confirm('Remover este bloco e os arquivos nele?')) return;
      blocks = blocks.filter(function (b) { return b.id !== block.id; });
      card.remove();
    });

    block.dropEl.addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () {
      addFiles(block, Array.prototype.slice.call(fileInput.files));
      fileInput.value = '';
    });

    ['dragenter', 'dragover'].forEach(function (evt) {
      block.dropEl.addEventListener(evt, function (e) {
        e.preventDefault(); e.stopPropagation();
        block.dropEl.classList.add('ns-dragover');
      });
    });
    ['dragleave', 'dragend'].forEach(function (evt) {
      block.dropEl.addEventListener(evt, function (e) {
        block.dropEl.classList.remove('ns-dragover');
      });
    });
    block.dropEl.addEventListener('drop', function (e) {
      e.preventDefault(); e.stopPropagation();
      block.dropEl.classList.remove('ns-dragover');
      addFiles(block, Array.prototype.slice.call(e.dataTransfer.files));
    });

    blocks.push(block);
    return block;
  }

  function addFiles(block, fileList) {
    fileList.forEach(function (file) {
      fileSeq++;
      var ext = extOf(file.name);
      var supported = ext === 'pdf' || file.type === 'application/pdf' ||
        file.type.indexOf('image/') === 0 || IMG_EXT.indexOf(ext) !== -1;
      block.files.push({ id: 'f' + fileSeq, file: file, supported: supported });
    });
    renderFiles(block);
    addStamp(block);
    setMsg('', '');
  }

  function renderFiles(block) {
    block.filesEl.innerHTML = '';
    block.files.forEach(function (entry) {
      var chip = document.createElement('div');
      chip.className = 'ns-chip' + (entry.supported ? '' : ' ns-bad');
      var tag = entry.supported ? (extOf(entry.file.name) === 'pdf' ? 'pdf' : 'img') : '?';
      chip.innerHTML =
        '<span class="ns-chip-tag">' + tag + '</span>' +
        '<span class="ns-chip-name" title="' + entry.file.name + '">' + entry.file.name + '</span>' +
        '<span class="mono" style="color:var(--text-dim);font-size:10px;">' + fmtSize(entry.file.size) + '</span>' +
        '<button title="Remover">' + iconX() + '</button>';
      if (!entry.supported) chip.title = 'Formato não suportado para conversão automática — será ignorado ao salvar';
      chip.querySelector('button').addEventListener('click', function () {
        block.files = block.files.filter(function (f) { return f.id !== entry.id; });
        renderFiles(block);
        if (block.files.length === 0) removeStamp(block);
      });
      block.filesEl.appendChild(chip);
    });
  }

  addCard.addEventListener('click', function () {
    var b = createBlock('Novo bloco');
    b.nameInput.focus();
    b.nameInput.select();
  });

  // blocos iniciais (nomes editáveis livremente)
  createBlock('EXTRATO DE MÃO DE OBRA PARA CONFERÊNCIA');
  createBlock('CROQUI');
  createBlock('CROQUI DIGITAL');
  createBlock('RELATÓRIO FOTOGRÁFICO DO LEVANTAMENTO DE CAMPO');
  createBlock('INSTRUMENTO PARTICULAR DE CONSTITUIÇÃO DE SERVIDÃO');

  // ---- conversão / mesclagem em PDF ----

  function readAsDataURL(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  function loadImage(src) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = src;
    });
  }

  function dataURLToBytes(dataUrl) {
    var base64 = dataUrl.split(',')[1];
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function imageFileToPdfBytes(file) {
    var dataUrl = await readAsDataURL(file);
    var img = await loadImage(dataUrl);
    var canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    var pngBytes = dataURLToBytes(canvas.toDataURL('image/png'));
    var pdfDoc = await PDFLib.PDFDocument.create();
    var pngImage = await pdfDoc.embedPng(pngBytes);
    var page = pdfDoc.addPage([pngImage.width, pngImage.height]);
    page.drawImage(pngImage, { x: 0, y: 0, width: pngImage.width, height: pngImage.height });
    return await pdfDoc.save();
  }

  async function fileToPdfBytes(file) {
    var ext = extOf(file.name);
    if (ext === 'pdf' || file.type === 'application/pdf') {
      return new Uint8Array(await file.arrayBuffer());
    }
    if (file.type.indexOf('image/') === 0 || IMG_EXT.indexOf(ext) !== -1) {
      return await imageFileToPdfBytes(file);
    }
    throw new Error('unsupported');
  }

  async function mergeBlockToPdf(block) {
    var merged = await PDFLib.PDFDocument.create();
    var ok = 0;
    for (var i = 0; i < block.files.length; i++) {
      var entry = block.files[i];
      try {
        var bytes = await fileToPdfBytes(entry.file);
        var src = await PDFLib.PDFDocument.load(bytes);
        var pages = await merged.copyPages(src, src.getPageIndices());
        pages.forEach(function (p) { merged.addPage(p); });
        ok++;
      } catch (e) {
        // arquivo não suportado, ignorado
      }
    }
    if (ok === 0) return null;
    return await merged.save();
  }

  async function convertBlockSeparately(block) {
    var results = [];
    var idx = 0;
    for (var i = 0; i < block.files.length; i++) {
      var entry = block.files[i];
      try {
        var bytes = await fileToPdfBytes(entry.file);
        idx++;
        results.push({ name: sanitize(block.nameInput.value) + ' (' + idx + ').pdf', bytes: bytes });
      } catch (e) {
        // arquivo não suportado, ignorado
      }
    }
    return results;
  }

  function triggerDownload(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }

  saveBtn.addEventListener('click', async function () {
    var ns = nsInput.value.trim();
    if (!ns) {
      nsInput.classList.add('ns-invalid');
      nsInput.focus();
      setMsg('Faltou o número da Nota de Serviço — ele não nasce em árvore.', 'err');
      return;
    }
    nsInput.classList.remove('ns-invalid');

    var withFiles = blocks.filter(function (b) { return b.files.length > 0; });
    if (withFiles.length === 0) {
      setMsg('Arraste ao menos um arquivo pra algum bloco — eu ainda não leio pensamento.', 'err');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.classList.add('ns-loading');
    setMsg('Convertendo e mesclando os arquivos... sem embaralhar, prometido.', '');

    try {
      var zip = new JSZip();
      var folderName = sanitize(ns);
      var folder = zip.folder(folderName);
      var skippedBlocks = [];

      for (var i = 0; i < withFiles.length; i++) {
        var block = withFiles[i];
        if (block.merge) {
          var pdfBytes = await mergeBlockToPdf(block);
          if (pdfBytes) {
            folder.file(sanitize(block.nameInput.value) + '.pdf', pdfBytes);
          } else {
            skippedBlocks.push(block.nameInput.value);
          }
        } else {
          var separateResults = await convertBlockSeparately(block);
          if (separateResults.length === 0) {
            skippedBlocks.push(block.nameInput.value);
          } else {
            separateResults.forEach(function (r) { folder.file(r.name, r.bytes); });
          }
        }
      }

      var content = await zip.generateAsync({ type: 'blob' });
      triggerDownload(content, folderName + '.zip');

      if (skippedBlocks.length) {
        setMsg('Baixado, mas ficou de fora (sem arquivo válido): ' + skippedBlocks.join(', ') + '.', 'err');
      } else {
        setMsg('Pronto! ' + folderName + '.zip baixado — pode fechar a aba sem medo.', 'ok');
      }
    } catch (e) {
      setMsg('Erro ao gerar o pacote: ' + e.message, 'err');
    } finally {
      saveBtn.disabled = false;
      saveBtn.classList.remove('ns-loading');
    }
  });

  nsInput.addEventListener('input', function () {
    var digitsOnly = nsInput.value.replace(/\D/g, '').slice(0, 10);
    if (digitsOnly !== nsInput.value) nsInput.value = digitsOnly;
    nsInput.classList.remove('ns-invalid');
  });
})();
</script>
